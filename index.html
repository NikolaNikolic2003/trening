/* Layout: one phone-width column, a week strip on top as both navigation and attendance glance, tabs fixed at the bottom. Each training day wears the color of a bumper plate. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#E1E5EA; --fg:#14181D; --muted:#586270; --line:#D2D8DF;
  --ink:#1B2A44; --on-ink:#FFFFFF; --ok:#1E8A4C; --warn:#B4541A;
  --push:#D8362B; --pull:#2563C9; --legs:#D9A400; --upper:#2E9E5B; --lower:#6B7480;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --surface:#181C22; --sunk:#22272F; --fg:#ECEFF3; --muted:#9AA4B0; --line:#2B323B;
    --ink:#DDE5F2; --on-ink:#10141A; --ok:#4CC47E; --warn:#F09A5B;
    --push:#F0564A; --pull:#4C8DF0; --legs:#F0C02A; --upper:#45C27A; --lower:#8E98A6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#181C22; --sunk:#22272F; --fg:#ECEFF3; --muted:#9AA4B0; --line:#2B323B;
  --ink:#DDE5F2; --on-ink:#10141A; --ok:#4CC47E; --warn:#F09A5B;
  --push:#F0564A; --pull:#4C8DF0; --legs:#F0C02A; --upper:#45C27A; --lower:#8E98A6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;margin:0}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;display:flex;flex-direction:column;gap:16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pull);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-size:28px;font-weight:700;text-transform:uppercase}
.sync{font-size:13px;color:var(--muted);text-align:right}
.sync.err{color:var(--warn)}
#app{display:flex;flex-direction:column;gap:16px}

/* week strip */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .label{font-family:var(--display);font-size:20px;font-weight:600}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:44px;height:40px;padding:0 12px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .num{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.day .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin-top:4px}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.day.sel .wd{color:var(--on-ink)}
.day.today:not(.sel){border-color:var(--ink)}
.dot.on{border-color:transparent}

/* type chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip.sel{background:var(--surface);border-color:var(--fg);font-weight:600}
.t-push{--t:var(--push)} .t-pull{--t:var(--pull)} .t-legs{--t:var(--legs)} .t-upper{--t:var(--upper)} .t-lower{--t:var(--lower)} .t-rest{--t:var(--line)}
.chip i,.dot.on,.plate,.cell.on{background:var(--t)}

/* workout head */
.whead{display:flex;flex-direction:column;gap:8px}
.whead .title{display:flex;align-items:center;gap:10px}
.plate{width:14px;height:34px;border-radius:3px;flex:none}
.whead h2{font-size:34px;font-weight:700;text-transform:uppercase;line-height:1}
.whead .sub{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--t);width:0}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* exercise */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ex-head h3{font-size:22px;font-weight:600;min-width:0}
.target{font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{font-size:13px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr auto 1fr auto;align-items:center;gap:8px}
.set .n{font-family:var(--display);font-weight:700;color:var(--muted);font-size:18px}
.set .n.done{color:var(--ok)}
.set input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.55;font-weight:400}
.set .u{font-size:13px;color:var(--muted);min-width:28px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.primary{background:var(--ink);color:var(--on-ink);border:0;border-radius:10px;padding:14px;font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.primary.done{background:transparent;color:var(--ok);border:2px solid var(--ok)}
.note{background:var(--sunk);border-radius:10px;padding:14px;font-size:14px;color:var(--muted);margin:0}
.note b{color:var(--fg)}

/* plan */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.plan-head{display:flex;align-items:center;gap:10px}
.plan-head h3{font-size:24px;font-weight:700;text-transform:uppercase;flex:1;min-width:0}
.plan-head .wdl{font-size:13px;color:var(--muted)}
.plan ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.plan li{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-top:1px solid var(--line);padding-top:4px}
.plan li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:22px;font-weight:600;text-transform:uppercase}
.heat{display:grid;grid-template-columns:18px 1fr;gap:6px}
.heat .rows{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:11px;color:var(--muted)}
.heat .rows span{display:flex;align-items:center}
.grid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.cell.future{opacity:.35}
.cell.today{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--t);display:block}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;font-size:16px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .end{fill:var(--fg);font-weight:600;font-size:13px}
.hist{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.hist li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:4px}
.hist li span:first-child{color:var(--muted);white-space:nowrap}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:14px 4px 12px;font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:3px solid transparent}
.tab.sel{color:var(--fg);border-top-color:var(--fg)}
</style>

</head>
<body>
<div class="wrap" style="padding-top:calc(12px + env(safe-area-inset-top,0px))">
  <header class="top">
    <h1>PPL/UL dnevnik</h1>
    <div class="sync" id="sync">Povezivanje…</div>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs"><div>
  <button class="tab" data-tab="trening" id="tab-trening">Trening</button>
  <button class="tab" data-tab="plan" id="tab-plan">Plan</button>
  <button class="tab" data-tab="napredak" id="tab-napredak">Napredak</button>
</div></nav>

<script>
const PLAN = {
  push:{name:'Push',sub:'Grudi, ramena, triceps',ex:[
    ['incline-db','Kosi potisak bučicama',3,'8–12','kosa mašina ili Smith'],
    ['fly','Razvlačenje na kablu / pec deck',3,'10–15',''],
    ['lateral','Lateralno odručenje',4,'12–15','bučice ili kabl'],
    ['dips','Propadanja',3,'8–12','potisak na mašini za ramena'],
    ['pushdown','Triceps potisak na kablu',3,'10–15',''],
    ['oh-ext','Triceps ekstenzija iznad glave',2,'10–15','']]},
  pull:{name:'Pull',sub:'Leđa, zadnje rame, biceps',ex:[
    ['lat-pd','Lat mašina, širi hvat',3,'8–12',''],
    ['cable-row','Veslanje na kablu, uži hvat',3,'8–12',''],
    ['db-row','Veslanje jednom rukom',2,'8–12',''],
    ['face-pull','Face pull / zadnje rame',3,'12–15',''],
    ['incline-curl','Biceps pregib na kosoj klupi',3,'8–12',''],
    ['hammer','Hammer pregib',2,'10–15','']]},
  legs:{name:'Legs',sub:'Noge, veći broj ponavljanja',ex:[
    ['hack','Hack čučanj / leg press',3,'8–12',''],
    ['bulgarian','Bugarski čučanj',3,'8–12','iskoraci'],
    ['leg-ext','Nožna ekstenzija',3,'10–15',''],
    ['seated-curl','Pregib za zadnju ložu, sedeći',3,'10–15',''],
    ['hip-thrust','Hip thrust',3,'8–12',''],
    ['calf-seated','Listovi sedeći',3,'10–15','']]},
  upper:{name:'Upper',sub:'Gornji deo, teško',ex:[
    ['bench','Bench press',3,'5–8','potisak bučicama'],
    ['bb-row','Veslanje u pretklonu',3,'6–8','T-bar ili oslonac za grudi'],
    ['ohp','Potisak iznad glave',3,'6–8','bučicama, sedeći'],
    ['pullup','Zgibovi',3,'6–10','lat mašina'],
    ['bb-curl','Biceps pregib šipkom',2,'8–12',''],
    ['skull','Skull crusher',2,'8–12','']]},
  lower:{name:'Lower',sub:'Donji deo, teško',ex:[
    ['squat','Čučanj',3,'5–8','hack čučanj'],
    ['rdl','Rumunsko mrtvo dizanje',3,'6–8',''],
    ['leg-press','Leg press',3,'8–10',''],
    ['lying-curl','Pregib za zadnju ložu, ležeći',3,'8–12',''],
    ['calf-stand','Listovi stojeći',3,'10–15','']]}
};
const TYPES=['push','pull','legs','upper','lower'];
const SCHED=['push','pull','legs','rest','upper','lower','rest']; // Mon..Sun
const WD=['Pon','Uto','Sre','Čet','Pet','Sub','Ned'];
const WDL=['Ponedeljak','Utorak','Sreda','Četvrtak','Petak','Subota','Nedelja'];
const MON=['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
const EXNAME={}; TYPES.forEach(t=>PLAN[t].ex.forEach(e=>EXNAME[e[0]]=e[1]));

const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const wdi=s=>(pd(s).getDay()+6)%7;
const monday=s=>addDays(s,-wdi(s));
const short=s=>{const d=pd(s);return d.getDate()+'. '+MON[d.getMonth()]};
const TODAY=()=>ds(new Date());
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');

const S={sessions:{},date:TODAY(),tab:'trening',exSel:'bench'};
const app=document.getElementById('app'), syncEl=document.getElementById('sync');
let col=null; const dirty={}, inflight={}, timers={}; let uploadedLocal=false;

function loadLocal(){try{const r=localStorage.getItem('pplul.sessions');if(r)S.sessions=JSON.parse(r)||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem('pplul.sessions',JSON.stringify(S.sessions))}catch(e){}}
function setSync(t,err){syncEl.textContent=t;syncEl.classList.toggle('err',!!err)}

const setsOf=(s,id)=>(s&&s.sets&&s.sets[id])||[];
const anySet=s=>!!s&&!!s.sets&&Object.values(s.sets).some(a=>a.some(x=>x&&x.r>0));
const trained=s=>!!s&&(s.done===true||anySet(s));
const isEmpty=s=>!s||(!s.done&&!(s.sets&&Object.values(s.sets).some(a=>a.some(x=>x&&(x.r!=null||x.w!=null)))));
const typeOf=date=>(S.sessions[date]&&S.sessions[date].type)||SCHED[wdi(date)];
function ensure(){if(!S.sessions[S.date])S.sessions[S.date]={type:typeOf(S.date),sets:{}};const s=S.sessions[S.date];if(!s.sets)s.sets={};return s}

function touch(date){
  dirty[date]=true;saveLocal();
  if(!col)return;
  setSync('Čuva se…');
  clearTimeout(timers[date]);timers[date]=setTimeout(()=>flush(date),900);
}
async function flush(date){
  if(!col||inflight[date]||!dirty[date])return;
  inflight[date]=true;dirty[date]=false;
  const s=S.sessions[date];
  try{
    if(isEmpty(s))await col.doc(date).delete();
    else await col.doc(date).set(JSON.parse(JSON.stringify(s)));
    inflight[date]=false;
    if(dirty[date])flush(date);
    else if(!Object.values(dirty).some(Boolean))setSync('Sačuvano');
  }catch(e){
    inflight[date]=false;dirty[date]=true;
    setSync('Nije sačuvano na nalogu, ostaje na ovom uređaju',true);
  }
}

function lastFor(id,before){
  const dates=Object.keys(S.sessions).filter(d=>d<before).sort().reverse();
  for(const d of dates){const a=setsOf(S.sessions[d],id).filter(x=>x&&x.r>0);if(a.length)return{date:d,sets:a}}
  return null;
}
const setTxt=x=>(x.w!=null?fmt(x.w)+'×':'')+x.r;
function progressOf(date){
  const t=typeOf(date);if(!PLAN[t])return{done:0,total:0};
  let done=0,total=0;const s=S.sessions[date];
  PLAN[t].ex.forEach(e=>{total+=e[2];done+=Math.min(e[2],setsOf(s,e[0]).filter(x=>x&&x.r>0).length)});
  return{done,total};
}

function stripHTML(){
  const m=monday(S.date),today=TODAY();let h='';
  for(let i=0;i<7;i++){
    const d=addDays(m,i),s=S.sessions[d],on=trained(s);
    h+=`<button class="day${d===S.date?' sel':''}${d===today?' today':''}" data-act="date" data-d="${d}" aria-label="${WDL[i]} ${short(d)}">
      <span class="wd">${WD[i]}</span><span class="num">${pd(d).getDate()}</span>
      <span class="dot ${on?'on t-'+typeOf(d):''}"></span></button>`;
  }
  const e=addDays(m,6);
  return `<div class="weeknav"><button class="iconbtn" data-act="week" data-n="-7" aria-label="Prethodna nedelja">‹</button>
    <span class="label">${short(m)} – ${short(e)}</span>
    <span class="row" style="gap:6px">${S.date!==today?'<button class="iconbtn" data-act="today">Danas</button>':''}
    <button class="iconbtn" data-act="week" data-n="7" aria-label="Sledeća nedelja">›</button></span></div>
    <div class="strip">${h}</div>`;
}
function chipsHTML(t){
  return '<div class="chips">'+TYPES.concat('rest').map(k=>`<button class="chip t-${k}${k===t?' sel':''}" data-act="type" data-t="${k}"><i></i>${k==='rest'?'Pauza':PLAN[k].name}</button>`).join('')+'</div>';
}
function renderTrening(){
  const t=typeOf(S.date),s=S.sessions[S.date];
  let h=stripHTML()+chipsHTML(t);
  if(t==='rest'){
    h+=`<p class="note"><b>${WDL[wdi(S.date)]}, ${short(S.date)}: pauza.</b> Ako ipak treniraš, izaberi trening iznad.</p>`;
    app.innerHTML=h;return;
  }
  const p=PLAN[t],pr=progressOf(S.date);
  h+=`<div class="whead t-${t}"><div class="title"><span class="plate"></span><div><h2>${p.name}</h2><div class="sub">${WDL[wdi(S.date)]}, ${short(S.date)} · ${p.sub}</div></div></div>
    <div class="bar"><span id="bar" style="width:${pr.total?pr.done/pr.total*100:0}%"></span></div>
    <div class="count" id="count">${pr.done} / ${pr.total} serija upisano</div></div>`;
  p.ex.forEach(e=>{
    const [id,name,n,reps,alt]=e,arr=setsOf(s,id),last=lastFor(id,S.date),rows=Math.max(n,arr.length);
    let r='';
    for(let i=0;i<rows;i++){
      const x=arr[i]||{},lp=last&&last.sets[i];
      r+=`<div class="set"><span class="n${x.r>0?' done':''}" id="n-${id}-${i}">${i+1}</span>
        <input id="w-${id}-${i}" inputmode="decimal" autocomplete="off" data-ex="${id}" data-i="${i}" data-f="w" value="${x.w!=null?fmt(x.w):''}" placeholder="${lp&&lp.w!=null?fmt(lp.w):'0'}" aria-label="${name}, serija ${i+1}, kilogrami"><span class="u">kg</span>
        <input id="r-${id}-${i}" inputmode="numeric" autocomplete="off" data-ex="${id}" data-i="${i}" data-f="r" value="${x.r!=null?x.r:''}" placeholder="${lp?lp.r:reps.split('–')[0]}" aria-label="${name}, serija ${i+1}, ponavljanja"><span class="u">pon.</span></div>`;
    }
    h+=`<section class="ex"><div class="ex-head"><h3>${name}</h3><span class="target">${n} × ${reps}</span></div>
      <p class="meta">${last?`Prošli put, ${short(last.date)}: <b>${last.sets.map(setTxt).join(' · ')}</b>`:'Prvi put upisuješ ovu vežbu.'}${alt?`<br>Zamena: ${alt}`:''}</p>
      <div class="sets">${r}</div>
      <div class="row"><button class="linkbtn" data-act="add" data-ex="${id}" data-rows="${rows}">+ serija</button>${arr.length>n?`<button class="linkbtn" data-act="rem" data-ex="${id}">− serija</button>`:''}</div></section>`;
  });
  const done=s&&s.done;
  h+=`<button class="primary${done?' done':''}" data-act="done">${done?'Trening završen ✓':'Završi trening'}</button>`;
  if(done)h+='<button class="linkbtn" data-act="done" style="align-self:center">Poništi završetak</button>';
  app.innerHTML=h;
}
function renderPlan(){
  let h='<p class="note"><b>Push, Pull, Legs, pauza, Upper, Lower, pauza.</b> Serije radi 1–2 ponavljanja do otkaza. Kad odradiš gornju granicu ponavljanja u svim serijama, dodaj težinu. Trbuh dodaj 2 puta nedeljno na kraju treninga, po 3 serije.</p>';
  const m=monday(TODAY());
  SCHED.forEach((t,i)=>{
    if(t==='rest')return;const p=PLAN[t];
    h+=`<section class="plan t-${t}"><div class="plan-head"><span class="plate"></span><h3>${p.name}</h3><span class="wdl">${WDL[i]}</span></div>
      <ol>${p.ex.map(e=>`<li><span>${e[1]}</span><span>${e[2]} × ${e[3]}</span></li>`).join('')}</ol>
      <button class="linkbtn" data-act="date" data-d="${addDays(m,i)}" style="align-self:flex-start">Otvori ${WDL[i].toLowerCase()} ove nedelje</button></section>`;
  });
  app.innerHTML=h;
}
function weekCount(m){let c=0;for(let i=0;i<7;i++)if(trained(S.sessions[addDays(m,i)]))c++;return c}
function renderNapredak(){
  const today=TODAY(),m=monday(today),thisWeek=weekCount(m);
  let c28=0;for(let i=0;i<28;i++)if(trained(S.sessions[addDays(today,-i)]))c28++;
  let streak=thisWeek>=4?1:0;for(let w=1;w<200;w++){if(weekCount(addDays(m,-7*w))>=4)streak++;else break}
  const total=Object.values(S.sessions).filter(trained).length;
  let h=`<div class="stats">
    <div class="stat"><div class="v">${thisWeek}/5</div><div class="k">treninga ove nedelje</div></div>
    <div class="stat"><div class="v">${Math.min(100,Math.round(c28/20*100))}%</div><div class="k">redovnost, poslednje 4 nedelje</div></div>
    <div class="stat"><div class="v">${streak}</div><div class="k">nedelja zaredom sa 4+ treninga</div></div></div>`;
  const start=addDays(m,-77);let cells='';
  for(let i=0;i<84;i++){const d=addDays(start,i),on=trained(S.sessions[d]);
    cells+=`<div class="cell${on?' on t-'+typeOf(d):''}${d>today?' future':''}${d===today?' today':''}" title="${short(d)}"></div>`}
  h+=`<section class="panel"><h2>Poslednjih 12 nedelja</h2>
    <div class="heat"><div class="rows">${['P','U','S','Č','P','S','N'].map(x=>`<span>${x}</span>`).join('')}</div><div class="grid">${cells}</div></div>
    <div class="legend">${TYPES.map(t=>`<span class="t-${t}"><i></i>${PLAN[t].name}</span>`).join('')}</div>
    <p class="meta">${total?`Ukupno upisanih treninga: <b>${total}</b>`:'Još nema upisanih treninga. Svaki dan kad upišeš bar jednu seriju dobija boju svog treninga.'}</p></section>`;
  const pts=Object.keys(S.sessions).sort().map(d=>{
    const a=setsOf(S.sessions[d],S.exSel).filter(x=>x&&x.r>0);if(!a.length)return null;
    return{d,w:Math.max(...a.map(x=>x.w||0)),r:Math.max(...a.map(x=>x.r)),a}}).filter(Boolean);
  const useW=pts.some(p=>p.w>0),val=p=>useW?p.w:p.r,unit=useW?'kg':'pon.';
  h+=`<section class="panel"><h2>Napredak po vežbi</h2>
    <select id="ex-select" aria-label="Vežba">${TYPES.map(t=>`<optgroup label="${PLAN[t].name}">${PLAN[t].ex.map(e=>`<option value="${e[0]}"${e[0]===S.exSel?' selected':''}>${e[1]}</option>`).join('')}</optgroup>`).join('')}</select>`;
  if(pts.length>=2){
    const W=320,H=150,L=34,R=44,T=14,B=24,vs=pts.map(val);let lo=Math.min(...vs),hi=Math.max(...vs);if(lo===hi){lo-=1;hi+=1}
    const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
    const line=pts.map((p,i)=>x(i).toFixed(1)+','+y(val(p)).toFixed(1)).join(' '),lp=pts[pts.length-1];
    h+=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Najbolja serija po treningu, ${unit}">
      <line x1="${L}" y1="${y(hi)}" x2="${W-R}" y2="${y(hi)}" stroke="var(--line)" stroke-width="1"/><line x1="${L}" y1="${y(lo)}" x2="${W-R}" y2="${y(lo)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L-6}" y="${y(hi)+4}" text-anchor="end">${fmt(hi)}</text><text x="${L-6}" y="${y(lo)+4}" text-anchor="end">${fmt(lo)}</text>
      <polyline points="${line}" fill="none" stroke="var(--pull)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(val(p)).toFixed(1)}" r="${i===pts.length-1?4:2.5}" fill="var(--pull)"/>`).join('')}
      <text class="end" x="${x(pts.length-1)+8}" y="${y(val(lp))+4}">${fmt(val(lp))}</text>
      <text x="${L}" y="${H-6}">${short(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${short(lp.d)}</text></svg>
      <p class="meta">Najveća ${useW?'težina (kg)':'serija (ponavljanja)'} po treningu.</p>`;
  }else h+=`<p class="meta">${pts.length?'Upisan je jedan trening. Linija se pojavljuje posle drugog.':'Za ovu vežbu još nema upisanih serija.'}</p>`;
  if(pts.length)h+=`<ul class="hist">${pts.slice(-6).reverse().map(p=>`<li><span>${short(p.d)}</span><span>${p.a.map(setTxt).join(' · ')}</span></li>`).join('')}</ul>`;
  h+='</section>';
  h+=`<section class="panel"><h2>Rezervna kopija</h2>
    <p class="meta">Treninzi se čuvaju samo na ovom telefonu. Povremeno sačuvaj kopiju, pa ako promeniš telefon ili obrišeš aplikaciju, učitaj je i sve se vraća.</p>
    <div class="row"><button class="iconbtn" data-act="export">Sačuvaj kopiju</button><button class="iconbtn" data-act="import">Učitaj kopiju</button></div>
    <p class="meta" id="backup-msg">${S.backupMsg||''}</p>
    <input type="file" id="import-file" accept="application/json,.json" hidden></section>`;
  app.innerHTML=h;
}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('sel',b.dataset.tab===S.tab));
  if(S.tab==='plan')renderPlan();else if(S.tab==='napredak')renderNapredak();else renderTrening();
}

document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;S.tab=b.dataset.tab;render();window.scrollTo(0,0)});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='export'){exportData();return}
  if(a==='import'){document.getElementById('import-file').click();return}
  if(a==='date'){S.date=b.dataset.d;S.tab='trening';render();if(b.closest('.plan'))window.scrollTo(0,0);return}
  if(a==='week'){S.date=addDays(S.date,+b.dataset.n)}
  else if(a==='today'){S.date=TODAY()}
  else if(a==='type'){const s=ensure();s.type=b.dataset.t;touch(S.date)}
  else if(a==='add'){const s=ensure(),id=b.dataset.ex;const arr=s.sets[id]||(s.sets[id]=[]);const want=+b.dataset.rows+1;while(arr.length<want)arr.push({});touch(S.date)}
  else if(a==='rem'){const s=ensure(),arr=s.sets[b.dataset.ex];if(arr&&arr.length)arr.pop();touch(S.date)}
  else if(a==='done'){const s=ensure();s.done=!s.done;touch(S.date)}
  render();
});
app.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.ex)return;
  const s=ensure(),id=t.dataset.ex,i=+t.dataset.i,arr=s.sets[id]||(s.sets[id]=[]);
  while(arr.length<=i)arr.push({});
  let v=num(t.value);if(v!=null&&v<0)v=null;if(v!=null&&t.dataset.f==='r')v=Math.round(v);
  if(v==null)delete arr[i][t.dataset.f];else arr[i][t.dataset.f]=v;
  const n=document.getElementById('n-'+id+'-'+i);if(n)n.classList.toggle('done',arr[i].r>0);
  const pr=progressOf(S.date),bar=document.getElementById('bar'),cnt=document.getElementById('count');
  if(bar)bar.style.width=(pr.total?pr.done/pr.total*100:0)+'%';if(cnt)cnt.textContent=pr.done+' / '+pr.total+' serija upisano';
  touch(S.date);
});
app.addEventListener('change',e=>{if(e.target.id==='import-file'&&e.target.files[0])importData(e.target.files[0])});
function exportData(){
  const body=JSON.stringify({app:'ppl-ul-dnevnik',version:1,exported:new Date().toISOString(),sessions:S.sessions},null,1);
  const url=URL.createObjectURL(new Blob([body],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='ppl-ul-rezerva-'+TODAY()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  S.backupMsg='Kopija je sačuvana u Preuzimanja (Downloads).';const m=document.getElementById('backup-msg');if(m)m.textContent=S.backupMsg;
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result),ss=d&&d.sessions;
      if(!ss||typeof ss!=='object')throw 0;
      let n=0;Object.keys(ss).forEach(k=>{if(DATE_RE.test(k)&&ss[k]&&typeof ss[k]==='object'){S.sessions[k]=ss[k];n++}});
      saveLocal();S.backupMsg='Učitano treninga iz kopije: '+n+'.';
    }catch(err){S.backupMsg='Ovaj fajl nije kopija iz PPL/UL dnevnika. Izaberi fajl koji počinje sa ppl-ul-rezerva.'}
    render();
  };
  r.readAsText(file);
}
app.addEventListener('change',e=>{if(e.target.id==='ex-select'){S.exSel=e.target.value;render()}});

const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function onSnap(snap){
  const seen={};
  snap.docs.forEach(d=>{if(!DATE_RE.test(d.id))return;seen[d.id]=1;if(dirty[d.id]||inflight[d.id])return;const b=d.data();if(b)S.sessions[d.id]=JSON.parse(JSON.stringify(b))});
  snap.docChanges().forEach(c=>{if(c.type==='removed'&&DATE_RE.test(c.doc.id)&&!dirty[c.doc.id]&&!inflight[c.doc.id])delete S.sessions[c.doc.id]});
  if(!snap.metadata.fromCache&&!uploadedLocal){
    uploadedLocal=true;
    Object.keys(S.sessions).forEach(d=>{if(DATE_RE.test(d)&&!seen[d]&&!isEmpty(S.sessions[d])){dirty[d]=true;flush(d)}});
    if(!Object.values(dirty).some(Boolean))setSync('Sačuvano');
  }
  saveLocal();
  const ae=document.activeElement;
  if(!(ae&&ae.tagName==='INPUT'&&app.contains(ae)))render();
}
async function connect(){
  try{
    if(!window.claude||!window.claude.use){setSync('Čuva se samo na ovom uređaju');return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){setSync('Čuva se samo na ovom uređaju');return}
    col=db.collection('data/users/'+uid);
    col.limit(1000).onSnapshot(onSnap,()=>{col=null;setSync('Čuva se samo na ovom uređaju',true)});
  }catch(e){setSync('Čuva se samo na ovom uređaju')}
}
loadLocal();render();
setSync('Čuva se na telefonu');
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
